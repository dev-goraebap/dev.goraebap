plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.8.0'
	id 'com.github.spotbugs' version '6.5.9'
	id 'org.jooq.jooq-codegen-gradle' version '3.21.6'
}

group = 'xyz.goraebap'
version = '0.0.1-SNAPSHOT'

// 런타임 jOOQ 버전을 코드 생성기와 맞춘다. 어긋나면 생성물이 런타임 API 와 맞지 않는다.
ext['jooq.version'] = '3.21.6'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    // 증빙 파일 — R2(S3)에 사전 서명 URL로 직접 올리고 연다. 로컬은 이 컴퓨터 폴더(LocalObjectStorage).
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    // 보고서 내려받기 — 엑셀에서 바로 여는 XLSX를 만든다.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    // 에이전트가 cowork를 읽고 쓰는 MCP 서버(/api/mcp) — 공식 MCP Java SDK의 stateless 서블릿 전송(cowork-guide-agent-access).
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.1.0'
    // 문서 가져오기 — Markdown(CommonMark + GFM 표 · 할 일 · 취소선)을 본문 에디터의 JSON으로 바꾼다.
    implementation 'org.commonmark:commonmark:0.31.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.31.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.31.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.31.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // The database is one SQLite file; Flyway's core reads SQLite on its own.
    implementation 'org.xerial:sqlite-jdbc'
    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 배포 이미지가 버전 없는 한 이름을 복사하게 한다. 버전은 이미지 태그가 갖는다.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'integration' }
	// CI 로그만 보고 원인을 알 수 있어야 한다 — 실패 시 전체 스택트레이스를 남긴다.
	testLogging {
		events 'failed'
		exceptionFormat 'full'
		showStackTraces = true
	}
}

/*
 * jOOQ 코드 생성: 실행 중인 데이터베이스 없이 마이그레이션 SQL 에서 직접 생성한다.
 * 빌드가 외부 상태에 의존하지 않으며, 스키마와 코드가 어긋나면 컴파일이 실패한다.
 * 생성물은 build/ 아래에만 두고 커밋하지 않는다 — 단일 원본을 두 벌로 만들지 않기 위해서다.
 */
jooq {
	configuration {
		generator {
			database {
				name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
				properties {
					property {
						key = 'sort'
						value = 'flyway'
					}
					property {
						key = 'defaultNameCase'
						value = 'lower'
					}
					property {
						key = 'unqualifiedSchema'
						value = 'public'
					}
					/*
					 * 데이터 이전 DML 을 파서에서 뺀다. DDLDatabase 는 인메모리 H2 로
					 * 스크립트를 재생하는데 gen_random_uuid 나 split_part 같은 PostgreSQL
					 * 함수가 거기 없어 파싱이 실패한다. 생성물에 필요한 것은 스키마뿐이므로
					 * `[jooq ignore start]` 로 감싼 구간을 건너뛴다.
					 */
					property {
						key = 'parseIgnoreComments'
						value = 'true'
					}
				}
				/*
				 * DDLDatabase 는 인메모리 H2 를 쓰므로 테이블이 PUBLIC 스키마에 잡힌다. SQLite 에는 스키마가
				 * 없으므로 기본 스키마로 내보내 테이블 이름만 렌더링되게 한다.
				 */
				schemata {
					schema {
						inputSchema = 'PUBLIC'
						outputSchemaToDefault = true
					}
				}
				/*
				 * timestamptz 는 실제로 일어난 순간이므로 도메인이 Instant 로 받는다. 변환을 손에
				 * 두면 저장소와 조회에 같은 메서드가 한 벌씩 생기고, 새 모듈마다 다시 복제된다.
				 * 여기서 내리면 생성물이 이미 Instant 를 주므로 그 자리가 사라진다.
				 *
				 * 시간대 없는 timestamp 는 걸리지 않는다. remind_at 처럼 사용자가 고른 "그 날 그
				 * 시각" 은 절대 순간이 아니라서 LocalDateTime 으로 남아야 한다.
				 */
				forcedTypes {
					// DDLDatabase의 H2가 JSONB를 JSON으로 읽으므로 실제 PostgreSQL 타입을 보존한다.
					forcedType {
						name = 'JSONB'
						includeExpression = '.*\\.role\\.permissions'
					}

					forcedType {
						// SQLite keeps moments as text; the binding writes one fixed UTC form that sorts like time.
						userType = 'java.time.Instant'
						binding = 'xyz.goraebap.shared.persistence.InstantTextBinding'
						includeTypes = 'TIMESTAMP.*WITH.*TIME.*ZONE'
					}
				}
			}
		}
	}
	/*
	 * 업무 DB와 로그 DB(시스템 현황의 활동·오류 기록, 파일이 따로다)를 각각 생성한다. 위 설정은 둘에 공통이고,
	 * 실행마다 스크립트와 패키지만 다르다.
	 */
	executions {
		main {
			configuration {
				generator {
					database {
						properties {
							property {
								key = 'scripts'
								value = 'src/main/resources/db/migration/*.sql'
							}
						}
					}
					target {
						packageName = 'xyz.goraebap.jooq'
						directory = layout.buildDirectory.dir('generated-sources/jooq').get().asFile.absolutePath
					}
				}
			}
		}
		logs {
			configuration {
				generator {
					database {
						properties {
							property {
								key = 'scripts'
								value = 'src/main/resources/db/logs/*.sql'
							}
						}
					}
					target {
						packageName = 'xyz.goraebap.jooq.logs'
						directory = layout.buildDirectory.dir('generated-sources/jooq-logs').get().asFile.absolutePath
					}
				}
			}
		}
	}
}

// 마이그레이션이 바뀔 때만 재생성한다.
tasks.named('jooqCodegenMain') {
	inputs.files(fileTree('src/main/resources/db/migration'))
}
tasks.named('jooqCodegenLogs') {
	inputs.files(fileTree('src/main/resources/db/logs'))
}

sourceSets {
	main {
		java {
			srcDir layout.buildDirectory.dir('generated-sources/jooq')
			srcDir layout.buildDirectory.dir('generated-sources/jooq-logs')
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('jooqCodegen')
}

/*
 * 코딩 표준은 세 도구가 겹치지 않게 나눠 맡는다.
 * 포맷은 Spotless 가 재작성하고, 컨벤션은 Checkstyle 이, 결함 패턴은 SpotBugs 가 본다.
 * 생성 코드는 우리가 쓴 것이 아니므로 셋 모두에서 제외한다.
 */
spotless {
	java {
		target fileTree('src') { include '**/*.java' }
		palantirJavaFormat()
		removeUnusedImports()
		formatAnnotations()
	}
}

checkstyle {
	toolVersion = '13.8.0'
	maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
	exclude '**/jooq/**'
}

spotbugs {
	excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html { required = true }
		xml { required = true }
	}
}

tasks.register('exportOpenApi', Test) {
    description = 'Writes the HTTP contract to openapi.json (the web generates its API types from it).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'xyz.goraebap.FoundationApiTest.openApiDescribesThePublicHealthContract' }
    systemProperty 'exportOpenApi', 'true'
    outputs.upToDateWhen { false }
}

tasks.register('integrationTest', Test) {
    description = 'Verifies migrations and queries against temporary SQLite databases.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }

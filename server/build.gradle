plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jooq.jooq-codegen-gradle' version '3.21.6'
}

group = 'xyz.goraebap'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 런타임 jOOQ 버전을 코드 생성기와 맞춘다. 어긋나면 생성물이 런타임 API와 맞지 않는다.
ext['jooq.version'] = '3.21.6'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
	// 파일 저장소. 주소를 주면 S3 호환 저장소에, 없으면 이 컴퓨터 폴더에 둔다.
	implementation platform('software.amazon.awssdk:bom:2.46.7')
	implementation 'software.amazon.awssdk:s3'
	// 에이전트가 읽고 쓰는 MCP 서버. 공식 MCP Java SDK의 stateless 서블릿 전송.
	implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
	implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.1.0'
	// 문서 가져오기: Markdown(CommonMark + GFM 표 · 할 일 · 취소선)을 본문 편집기의 JSON으로 바꾼다.
	implementation 'org.commonmark:commonmark:0.31.0'
	implementation 'org.commonmark:commonmark-ext-gfm-tables:0.31.0'
	implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.31.0'
	implementation 'org.commonmark:commonmark-ext-task-list-items:0.31.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// DB는 SQLite 파일이다. Flyway 코어가 SQLite를 직접 읽는다.
	implementation 'org.xerial:sqlite-jdbc'
	jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 컨텍스트 맵 검사(ContextMapTest)가 코드의 참조를 읽는다.
	testImplementation 'com.tngtech.archunit:archunit:1.4.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/*
 * jOOQ 코드 생성: 실행 중인 데이터베이스 없이 마이그레이션 SQL에서 직접 생성한다.
 * 생성물은 build/ 아래에만 두고 커밋하지 않는다.
 */
jooq {
	configuration {
		generator {
			database {
				name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
				properties {
					property {
						key = 'sort'
						value = 'flyway'
					}
					property {
						key = 'defaultNameCase'
						value = 'lower'
					}
					property {
						key = 'unqualifiedSchema'
						value = 'public'
					}
					// `[jooq ignore start]`로 감싼 구간은 파서가 건너뛴다.
					property {
						key = 'parseIgnoreComments'
						value = 'true'
					}
				}
				// DDLDatabase는 인메모리 H2를 써서 표가 PUBLIC 스키마에 잡힌다. SQLite에는 스키마가 없으므로 기본 스키마로 내보낸다.
				schemata {
					schema {
						inputSchema = 'PUBLIC'
						outputSchemaToDefault = true
					}
				}
				forcedTypes {
					forcedType {
						// SQLite는 순간을 글자로 둔다. 바인딩이 시간순으로 정렬되는 UTC 한 형식으로 쓴다.
						userType = 'java.time.Instant'
						binding = 'xyz.goraebap.shared.persistence.InstantTextBinding'
						includeTypes = 'TIMESTAMP.*WITH.*TIME.*ZONE'
					}
				}
			}
		}
	}
	// 업무 DB와 로그 DB(파일이 따로다)를 각각 생성한다. 업무 DB는 마이그레이션 폴더(db/<묶음>)가 여럿이어도 DB가 하나라 한 패키지로 만든다.
	executions {
		main {
			configuration {
				generator {
					database {
						properties {
							property {
								key = 'scripts'
								value = 'src/main/resources/db/*/*.sql'
							}
						}
					}
					target {
						packageName = 'xyz.goraebap.jooq'
						directory = layout.buildDirectory.dir('generated-sources/jooq').get().asFile.absolutePath
					}
				}
			}
		}
		logs {
			configuration {
				generator {
					database {
						properties {
							property {
								key = 'scripts'
								value = 'src/main/resources/db-logs/*/*.sql'
							}
						}
					}
					target {
						packageName = 'xyz.goraebap.jooq.logs'
						directory = layout.buildDirectory.dir('generated-sources/jooq-logs').get().asFile.absolutePath
					}
				}
			}
		}
	}
}

// 마이그레이션이 바뀔 때만 다시 생성한다.
tasks.named('jooqCodegenMain') {
	inputs.files(fileTree('src/main/resources/db'))
}
tasks.named('jooqCodegenLogs') {
	inputs.files(fileTree('src/main/resources/db-logs'))
}

sourceSets {
	main {
		java {
			srcDir layout.buildDirectory.dir('generated-sources/jooq')
			srcDir layout.buildDirectory.dir('generated-sources/jooq-logs')
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('jooqCodegen')
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// 컨텍스트 맵 검사가 읽을 파일.
	inputs.file('contexts.json')
	systemProperty 'contexts.file', file('contexts.json').absolutePath
	// CI 로그만 보고 원인을 알 수 있게 실패한 테스트의 스택트레이스를 남긴다.
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
		showStackTraces = true
	}
}

// 배포 이미지가 버전 없는 한 이름을 복사하게 한다.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

# Each test context gets a database file of its own under build/.
spring.datasource.url=jdbc:sqlite:build/test-db/${random.uuid}.db
app.system.log-db=build/test-db/logs-${random.uuid}.db
app.auth.secret=test-only-secret-00000000000000000000000000000000
app.auth.allowed-origins=http://localhost:4402
app.auth.cookie-secure=false
app.auth.dev-login=false
app.jobs.enabled=false
# Files go under build/ like the database; the secret above signs their URLs.
app.storage.local-root=build/test-files/${random.uuid}
app.secrets.generate=false
app.git.encryption-key=test-only-git-key

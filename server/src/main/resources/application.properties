spring.application.name=cowork
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
# Compress what the browser downloads as text (the screens' scripts are about 1MB raw). The event stream
# (text/event-stream) stays out so each signal is sent as it happens.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/problem+json,application/manifest+json,image/svg+xml
server.compression.min-response-size=1KB
# One SQLite file. WAL lets reads go on while a write runs; a transaction takes the write lock as it begins
# (IMMEDIATE), so two never collide halfway through; a write waits up to five seconds for the one before it. A read-only
# transaction begins DEFERRED instead (ReadOnlyDeferredDataSource), so a page's parallel reads do not line up for it.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/cowork.db}
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.jooq.sql-dialect=SQLITE
# The log database of the system status page (activities, request counts, server errors), a file of its own.
app.system.log-db=${LOG_DB_PATH:./data/logs.db}
# The release the server was built from, shown on the system status page; the image sets it from its tag.
app.version=${APP_VERSION:local}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# A database made before its Flyway history (one restored from elsewhere) is marked at V1; keep false elsewhere.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/v1/**
# Made on first start when unset (GeneratedSecrets, secrets.properties beside the database).
app.auth.secret=${AUTH_SECRET:}
# Seals repository tokens and webhook secrets (저장소 연동); changing it means connecting repositories again.
app.git.encryption-key=${GIT_ENCRYPTION_KEY:}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.dev-login=${AUTH_DEV_LOGIN:false}
# Members named here by work e-mail (comma separated) are made instance administrators each time the server starts, so
# a new install, or one where every instance administrator has left, always has someone to give out roles.
app.auth.instance-admin-emails=${INSTANCE_ADMIN_EMAILS:}
# The old cowork-hr app's sign-ins are carried over until this instant (such as 2026-11-30T15:00:00Z); empty keeps each
# one until its own expiry.
app.auth.legacy-carry-over-until=${AUTH_LEGACY_CARRY_OVER_UNTIL:}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Private object storage for evidence files. With STORAGE_ENDPOINT set it is R2 (S3): browsers upload and open
# through presigned URLs on public-endpoint, so it must be reachable from them; the server talks to endpoint. Without
# it the files go under local-root on this machine and this server signs the URLs (a local run needs nothing set).
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:${app.storage.endpoint}}
app.storage.region=${STORAGE_REGION:auto}
app.storage.bucket=${STORAGE_BUCKET:cowork-hr}
# The environment's folder in a bucket shared by environments, such as cowork-hr/dev/; empty for a bucket of its own.
app.storage.key-prefix=${STORAGE_KEY_PREFIX:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/files}
# Browser push (Web Push). The VAPID key pair is URL-safe Base64 of the raw P-256 public point and private scalar;
# without both, nothing is pushed and the settings screen says so. subject tells push services whom to contact.
# Made on first start when unset, like app.auth.secret.
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:no-reply@example.test}
# Daily jobs such as annual leave accrual; tests turn them off and run them directly.
app.jobs.enabled=${APP_JOBS_ENABLED:true}
# When approvers hear of the requests still waiting for them (Seoul): every day, holidays too, at 9, 13 and 16.
app.approval.reminder-cron=${APP_APPROVAL_REMINDER_CRON:0 0 9,13,16 * * *}

# Seed files a server brings in once when it starts (cowork-guide-architecture, 개발 서버 채우기): every *.json in this
# folder, by default seed beside the database (/var/lib/cowork/seed in the image). Production has no such folder.
app.seed.dir=${SEED_DIR:}
# Who brings them in and stands for the writers a file names who are no member: the member with this e-mail, else the
# first instance administrator, else the first member.
app.seed.actor-email=${SEED_ACTOR_EMAIL:}

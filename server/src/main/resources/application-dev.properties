# Development login must only be reachable from this machine.
server.address=127.0.0.1
# A local run needs no .env: the browser comes from the Vite server (web/ on 4420; 4402 was the old client/), cookies go over plain
# http, and login codes are written to the log instead of mailed unless MAIL_HOST is set.
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:4402,http://localhost:4420}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.mail.log-codes=true

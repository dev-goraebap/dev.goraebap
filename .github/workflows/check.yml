name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: plugins/webapp
      - run: npm run check
        working-directory: plugins/webapp
      - run: npm test
        working-directory: plugins/webapp
      # dist는 content·skills에서 만든 생성물이다. 원본을 고치고 다시 만들지 않았으면 여기서 멈춘다.
      - run: git diff --exit-code -- plugins/webapp/dist

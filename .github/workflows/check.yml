name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: plugins/webapp
      # content에서 만든 .agents/skills/goraebap-webapp이 최신인지도 함께 본다.
      - run: npm run check
        working-directory: plugins/webapp

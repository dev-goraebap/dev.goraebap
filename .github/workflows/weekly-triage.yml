name: Weekly Inbox Triage & PR Revision
on:
  schedule:
    # 매주 일요일 10:00 KST (01:00 UTC)
    - cron: "0 1 * * 0"
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: weekly-triage-${{ github.event.issue.number || 'batch' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 1) 주간 묶음 PR 배치 (일요일 자동 또는 수동 실행)
  weekly-batch:
    name: Weekly Inbox Batch PR
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check Gemini API key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 등록되지 않아 주간 배치를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_key.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Collect trusted open inbox issues (zero-token prefilter)
        id: inbox
        if: steps.check_key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 공개 저장소 보안 가드레일: OWNER 또는 github-actions[bot]이 작성한 inbox:* 이슈만 처리
          gh issue list --state open --limit 50 --json number,title,body,labels,author,authorAssociation \
            | jq '[.[] | select(
                ([.labels[].name] | any(startswith("inbox:")))
                and (.authorAssociation == "OWNER" or .author.login == "app/github-actions" or .author.login == "github-actions")
              )]' > /tmp/inbox-issues.json
          COUNT="$(jq 'length' /tmp/inbox-issues.json)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "신뢰된 열린 inbox 이슈: ${COUNT}건"

      - uses: pnpm/action-setup@v4
        if: steps.check_key.outputs.ready == 'true' && steps.inbox.outputs.count != '0'

      - uses: actions/setup-node@v4
        if: steps.check_key.outputs.ready == 'true' && steps.inbox.outputs.count != '0'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Prepare dependencies & weekly branch
        if: steps.check_key.outputs.ready == 'true' && steps.inbox.outputs.count != '0'
        run: |
          set -euo pipefail
          npm ci --prefix plugins/fullstack
          pnpm --dir web install --frozen-lockfile
          git config user.name "dev-goraebap-bot"
          git config user.email "dev-goraebap-bot@users.noreply.github.com"
          BRANCH="chore/weekly-inbox-$(date +%Y%m%d)"
          git checkout -B "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run Gemini CLI weekly triage
        if: steps.check_key.outputs.ready == 'true' && steps.inbox.outputs.count != '0'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            너는 dev-goraebap/dev.goraebap 저장소의 주간 인박스 묶음 처리 에이전트다.
            `/tmp/inbox-issues.json`에 신뢰된 열린 `inbox:*` 이슈 목록이 담겨 있다.

            먼저 반드시 읽을 문서:
            - `AGENTS.md`
            - `docs/guides/guidelines.md`
            - `docs/guides/diataxis.md`
            - `docs/guides/blog.md`

            절대 금지 가드레일:
            - `.github/workflows/` 및 `deploy/` 파일은 절대 수정하지 않는다.
            - `git push`나 `gh pr create`를 직접 실행하지 않는다(후속 가드레일 단계가 검증 후 푸시·PR 생성을 맡는다).

            이슈 유형별 처리 원칙:
            1. `inbox:design`: 시각적 확인이 필요한 UI/디자인 시스템 변경이므로 코드를 수정하지 않는다.
               대신 해당 이슈에 구체적인 레시피·레이아웃 개선 초안을 한국어 댓글로 남기고,
               `gh issue edit <번호> --add-label "needs-local-design" --remove-label "inbox:design"`으로 분리한다.
            2. `inbox:bug`, `inbox:gap`, `inbox:harvest`, `inbox:upgrade`, `inbox:audit`:
               - `web/apps/blog/content/` 문서·지침을 Diátaxis와 중립성 규칙에 맞게 수정하고, 패치 수준 보안 업데이트가 안전하면 함께 반영한다.
               - `plugins/fullstack`에서 `npm run build && npm run check`를 실행해 `dist/`와 마켓플레이스 파일을 최신화한다.
               - `web/`에서 `pnpm lint && pnpm typecheck && pnpm --filter @goraebap/blog build`를 모두 통과시킨다.
            3. 변경 사항을 현재 브랜치에 커밋하고, PR 본문 요약을 `/tmp/weekly-pr-body.md`에 한국어로 저장한다(처리한 이슈 번호마다 `Closes #<번호>` 포함).

      - name: Enforce guardrail, push branch, and open/update PR
        if: steps.check_key.outputs.ready == 'true' && steps.inbox.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 1) 보호 경로 수정 여부 강제 검증 (push 이전 차단)
          CHANGED="$(git diff --name-only origin/main...HEAD; git status --porcelain | awk '{print $2}')"
          if echo "$CHANGED" | grep -Eq '^(\.github/workflows/|deploy/)'; then
            echo "::error::보안 가드레일 위반: AI가 보호 경로(.github/workflows/ 또는 deploy/)를 수정했습니다."
            exit 1
          fi

          # 2) 미커밋 변경이 있으면 정리
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(inbox): 주간 인박스 피드백 및 감사 항목 반영"
          fi

          # 3) origin/main 대비 실제 커밋이 없으면 PR 생성 생략
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "코드/문서 변경 없음(디자인 이슈 분리 등만 완료) — PR 생성 생략"
            exit 0
          fi

          git push --force-with-lease origin "HEAD:$BRANCH"
          BODY_FILE="/tmp/weekly-pr-body.md"
          if [ ! -s "$BODY_FILE" ]; then
            printf '## 주간 인박스 묶음 반영\n\n`weekly-triage.yml`이 열린 `inbox:*` 이슈를 반영했습니다.\n' > "$BODY_FILE"
          fi

          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file "$BODY_FILE"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(inbox): 주간 인박스 개선 묶음 ($(date +%Y-%m-%d))" \
              --body-file "$BODY_FILE"
          fi

  # 2) PR 댓글(@gemini-cli) 수정 응답 — OWNER 전용
  pr-comment-revision:
    name: PR Comment Revision (Owner Only)
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.comment.author_association == 'OWNER'
      && contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Check Gemini API key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 등록되지 않아 PR 댓글 응답을 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_key.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.check_key.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check_key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Checkout PR branch & save owner instruction
        if: steps.check_key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER"
          printf '%s\n' "$COMMENT_BODY" > /tmp/pr-comment.txt
          npm ci --prefix plugins/fullstack
          pnpm --dir web install --frozen-lockfile
          git config user.name "dev-goraebap-bot"
          git config user.email "dev-goraebap-bot@users.noreply.github.com"

      - name: Apply owner revision via Gemini CLI
        if: steps.check_key.outputs.ready == 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ github.event.issue.number }}
          prompt: |
            저장소 소유자가 현재 PR에 남긴 수정 지시가 `/tmp/pr-comment.txt`에 저장되어 있다.

            절차:
            1. `/tmp/pr-comment.txt`와 `AGENTS.md`, `docs/guides/guidelines.md`, `docs/guides/diataxis.md`를 읽는다.
            2. 요청된 수정만 반영한다. `.github/workflows/`와 `deploy/` 파일은 절대 수정하지 않는다.
            3. `git push`는 실행하지 않는다(후속 가드레일 단계가 검증 후 푸시한다).
            4. `content/`를 수정했으면 `plugins/fullstack`에서 `npm run build && npm run check`를 실행한다.
            5. `web/`에서 `pnpm lint && pnpm typecheck && pnpm --filter @goraebap/blog build`를 통과시킨다.
            6. 현재 PR 브랜치에 커밋하고, 소유자에게 보낼 반영 요약을 `/tmp/pr-reply.md`에 한국어로 적는다.

      - name: Enforce guardrail, push revision, and reply on PR
        if: steps.check_key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only origin/main...HEAD; git status --porcelain | awk '{print $2}')"
          if echo "$CHANGED" | grep -Eq '^(\.github/workflows/|deploy/)'; then
            echo "::error::보안 가드레일 위반: AI가 보호 경로(.github/workflows/ 또는 deploy/)를 수정했습니다."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix(inbox): PR #${PR_NUMBER} 리뷰 지시 반영"
          fi

          git push
          REPLY_FILE="/tmp/pr-reply.md"
          if [ ! -s "$REPLY_FILE" ]; then
            printf '요청하신 수정 사항을 반영하고 빌드·검사를 통과해 푸시했습니다.\n' > "$REPLY_FILE"
          fi
          gh pr comment "$PR_NUMBER" --body-file "$REPLY_FILE"

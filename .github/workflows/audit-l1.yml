name: L1 Static Audit
on:
  schedule:
    # 매주 월요일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-l1:
    name: Zero-Token Static & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          npm ci --prefix plugins/fullstack
          pnpm --dir web install --frozen-lockfile

      - name: Run L1 audit
        run: node scripts/audit-l1.mjs --out /tmp/audit-l1.json

      - name: Sync inbox:audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="[L1 감사] 주간 정적 · 보안 · 링크 점검 결과"
          HAS_FINDINGS="$(jq -r '.hasFindings' /tmp/audit-l1.json)"
          jq -r '.markdown' /tmp/audit-l1.json > /tmp/audit-l1.md

          EXISTING="$(gh issue list --label "inbox:audit" --state open --json number,title --jq '[.[] | select(.title == "'"$TITLE"'")][0].number // empty')"

          if [ "$HAS_FINDINGS" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file /tmp/audit-l1.md
              echo "Updated existing L1 audit issue #$EXISTING"
            else
              gh issue create --label "inbox:audit" --title "$TITLE" --body-file /tmp/audit-l1.md
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "이번 주 L1 감사에서 모든 항목이 정상으로 확인되어 자동 종료합니다."
            else
              echo "L1 감사 이상 없음 — 이슈 생성 생략"
            fi
          fi

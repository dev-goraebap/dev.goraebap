<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>goraebap/design — 디자인 시스템</title>
    <meta
      name="description"
      content="HTML·React·Angular 세 환경에서 같은 토큰과 마감으로 구현하는 고래밥 디자인 시스템 포털입니다."
    />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://design.goraebap.xyz/" />
    <meta property="og:title" content="goraebap/design — 디자인 시스템" />
    <meta
      property="og:description"
      content="HTML·React·Angular 세 환경에서 같은 토큰과 마감으로 구현하는 고래밥 디자인 시스템 포털입니다."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@600;700&display=swap"
    />
    <style>
      html.fonts-loading {
        opacity: 0;
      }
      html {
        transition: opacity 120ms ease-out;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        const stored = localStorage.getItem("goraebap-design-mode");
        if (stored === "light") {
          root.classList.remove("dark");
        } else {
          root.classList.add("dark");
        }
        root.classList.add("fonts-loading");
        const reveal = () => root.classList.remove("fonts-loading");
        const timer = setTimeout(reveal, 180);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            clearTimeout(timer);
            reveal();
          });
        } else {
          reveal();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/entry.tsx"></script>
  </body>
</html>

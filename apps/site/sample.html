<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 레이어 순서: Tailwind(theme · base … components · utilities) 사이에 Astryx 견본만 읽는 Astryx 레이어를 끼운다(SampleFrame). -->
    <style>@layer theme, base, reset, astryx-base, astryx-theme, app, components, utilities;</style>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>견본</title>
    <style>html, body { margin: 0; }</style>
    <script>
      // 견본이 뜨기 전에도 가이드와 같은 모드로 그려 다크 화면에 흰 틀이 비치지 않게 한다. data-theme은 shadcn 토큰이 읽는다.
      (() => {
        let mode;
        try { mode = window.parent !== window ? window.parent.document.documentElement.dataset.theme : undefined; } catch {}
        try { mode = mode || localStorage.getItem('guide-theme'); } catch {}
        if (mode !== 'dark' && mode !== 'light') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.style.colorScheme = mode;
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="sample-root"></div>
    <script type="module" src="/src/app/sample.tsx"></script>
  </body>
</html>
